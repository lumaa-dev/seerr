name: Sync Upstream

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch: # allows manual trigger from the Actions tab

permissions:
  contents: write
  issues: write # only needed if you want the auto-filed issue on conflict

env:
  UPSTREAM_URL: https://github.com/seerr-team/seerr.git
  UPSTREAM_REPO: seerr-team/seerr
  BRANCH: develop # your fork's branch to sync — change if different

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          ref: ${{ env.BRANCH }}
          persist-credentials: true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config pull.rebase false

      - name: Get latest stable release tag
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq '.tag_name')
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::Could not resolve latest release tag from ${UPSTREAM_REPO}"
            exit 1
          fi
          echo "Latest stable release: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Add upstream remote
        run: |
          git remote add upstream "$UPSTREAM_URL" 2>/dev/null || git remote set-url upstream "$UPSTREAM_URL"

      - name: Fetch release tag
        run: |
          git fetch upstream "refs/tags/${{ steps.release.outputs.tag }}:refs/tags/${{ steps.release.outputs.tag }}"

      - name: Check if already up to date
        id: check
        run: |
          if git merge-base --is-ancestor "${{ steps.release.outputs.tag }}" HEAD; then
            echo "uptodate=true" >> "$GITHUB_OUTPUT"
          else
            echo "uptodate=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge release tag into ${{ env.BRANCH }}
        id: merge
        if: steps.check.outputs.uptodate == 'false'
        run: |
          if git merge "${{ steps.release.outputs.tag }}" --no-edit -m "chore: sync with ${{ steps.release.outputs.tag }}"; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            echo "files<<EOF" >> "$GITHUB_OUTPUT"
            git diff --name-only --diff-filter=U >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            git merge --abort
          fi

      - name: Push merged changes
        if: steps.check.outputs.uptodate == 'false' && steps.merge.outputs.conflict == 'false'
        run: git push origin "${BRANCH}"

      - name: File an issue on conflict
        if: steps.merge.outputs.conflict == 'true'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v8
        with:
          script: |
            const files = `${{ steps.merge.outputs.files }}`.trim();
            const tag = `${{ steps.release.outputs.tag }}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Upstream sync failed: merge conflict with ${tag}`,
              body: [
                `The scheduled sync from \`${process.env.UPSTREAM_REPO}\` release \`${tag}\` (branch \`${process.env.BRANCH}\`) hit a merge conflict and was aborted. Local changes were **not** overwritten.`,
                '',
                'Conflicting files:',
                '```',
                files || '(unable to list — check the workflow run log)',
                '```',
                '',
                `See the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details. You'll need to resolve this manually, e.g.:`,
                '```bash',
                `git remote add upstream ${process.env.UPSTREAM_URL}`,
                `git fetch upstream refs/tags/${tag}:refs/tags/${tag}`,
                `git merge ${tag}`,
                '# resolve conflicts, then commit & push',
                '```',
              ].join('\n'),
              labels: ['upstream-sync', 'conflict'],
            });

      - name: Fail the job on conflict
        if: steps.merge.outputs.conflict == 'true'
        run: |
          echo "::error::Merge conflict with ${{ steps.release.outputs.tag }} — merge aborted, local changes preserved."
          exit 1
